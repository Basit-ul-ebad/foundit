name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'tool/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo keeps only lib/, test/ and pubspec.yaml. Generate the Android
      # platform folder, then restore our tracked files that flutter create replaces.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.onavri --project-name foundit --platforms android .
            git checkout -- .
          fi

      # A fixed debug keystore keeps the APK signature (and its SHA-1) the same
      # on every build, which Google sign-in needs.
      - name: Use the fixed debug keystore
        working-directory: .
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Optional Firebase config from secret
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            echo "$GSJ" > android/app/google-services.json
            echo "google-services.json written"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: APK size (NFR-01 target is 20 MB or less installed; APK size is only a proxy)
        run: ls -l build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: foundit-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # A release page lets you download the APK straight on your phone.
      - name: Publish to the latest-build release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk foundit.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build foundit.apk --prerelease \
            --title "Latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}. Debug-signed APK for testing."
