name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'tool/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      LOGDIR: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo keeps only lib/, test/ and pubspec.yaml. Generate the Android
      # platform folder, then restore our tracked files that flutter create replaces.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.onavri --project-name foundit --platforms android .
            git checkout -- .
          fi

      # A fixed debug keystore keeps the APK signature (and its SHA-1) the same
      # on every build, which Google sign-in needs.
      - name: Use the fixed debug keystore
        working-directory: .
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - name: Firebase settings (only when the secret is set)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
            python3 ../tool/make_firebase_options.py android/app/google-services.json lib/firebase_options.dart
          else
            echo "No GOOGLE_SERVICES_JSON secret: building in local mode."
          fi

      # Release builds need the INTERNET permission, and the app name should read Foundit.
      - name: Patch Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="foundit"#android:label="Foundit"#' "$M"

      - run: mkdir -p "$LOGDIR"
      - run: flutter pub get 2>&1 | tee "$LOGDIR/pub-get.txt"
      - run: cp pubspec.lock "$LOGDIR/pubspec.lock.txt"
      - run: flutter analyze --no-fatal-infos 2>&1 | tee "$LOGDIR/analyze.txt"
      - run: flutter test 2>&1 | tee "$LOGDIR/test.txt"

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 2>&1 | tee "$LOGDIR/build.txt"

      - name: APK size (NFR-01 target is 20 MB or less installed; APK size is only a proxy)
        run: ls -l build/app/outputs/flutter-apk/app-release.apk

      - name: Push logs to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p "$LOGDIR"
          echo "run ${{ github.run_id }} commit ${GITHUB_SHA}" > "$LOGDIR/run.txt"
          cd "$LOGDIR"
          git init -q -b ci-logs
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "ci logs for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: foundit-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      # A release page lets you download the APK straight on your phone.
      - name: Publish to the latest-build release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk foundit.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build foundit.apk --prerelease \
            --title "Latest build" \
            --notes "Auto-built from commit ${GITHUB_SHA::7}. Debug-signed APK for testing."
